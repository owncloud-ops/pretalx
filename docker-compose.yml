      - PRETALX_SITE_SECRET="q=j2-drfc1b*)hhijyl)t8szc=wwu3gq(%wuea(&t3=rmew8%+"
      - PRETALX_DB_TYPE=postgresql
      - PRETALX_DB_NAME=pretalx
      - PRETALX_DB_USER=pretalx
      - PRETALX_DB_PASS=password
      - PRETALX_DB_HOST=db
      - PRETALX_DB_PORT=5432
      - PRETALX_MAIL_FROM=no-reply@congresso-spmc.com
      - PRETALX_MAIL_HOST=mail.congresso-spmc.com
