      - PRETALX_MAIL_SSL=true
      - PRETALX_REDIS_HOST=redis
      - PRETALX_REDIS_PORT=6379
      - PRETALX_LANGUAGE_CODE=en
      - PRETALX_TIME_ZONE=Europe/Lisbon
      - PRETALX_LOG_LEVEL=info
      - PRETALX_GUNICORN_WORKERS=3
    volumes:
      - pretalx_data:/data

  nginx:
    image: nginx:latest
    container_name: pretalx_nginx
    depends_on:
      - pretalx
    ports:
      - "80:80"
    volumes:
      - pretalx_data:/data:ro
      - ./nginx.conf:/etc/nginx/nginx.conf:ro

  db:
    image: postgres:16-alpine
    container_name: pretalx_db
    environment:
      - POSTGRES_DB=pretalx
      - POSTGRES_USER=pretalx
      - POSTGRES_PASSWORD=password
    volumes:
      - db_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine

volumes:
  pretalx_data:
  pretalx_static:
  db_data:
